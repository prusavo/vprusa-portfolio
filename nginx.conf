# vprusa.com — serves the Astro static build.
#
# Listens inside the shared WireGuard network namespace, so it is reachable by
# every WG peer at http://10.13.13.1:1342 and by nobody on the public internet
# (see network_mode in /opt/stacks/vprusa-web/compose.yaml). When the site goes
# public this file stays as-is and a reverse proxy terminates TLS in front.
server {
    listen 1342;
    listen [::]:1342;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Astro emits content-hashed asset names — safe to cache for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted font files are hashed too.
    location ~* \.(woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must revalidate so a redeploy is visible immediately.
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    # build.format: 'file' emits /page.html, so try the .html sibling before
    # giving up. No SPA-style fallback to index.html: an unknown path must 404
    # rather than answer 200 with the homepage.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml;

    access_log /var/log/nginx/access.log;
}
